# Fuller evaluation CI. Does not replace .github/workflows/ci.yml.
name: Eval

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  rust-and-datalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (node crate)
        run: cargo test --manifest-path node/Cargo.toml -- --test-threads=1
      - name: Install Soufflé
        # The published PPA list at souffle-lang.github.io/ppa/souffle-latest.list
        # returns 404, so install the official 2.5 .deb from the GitHub release.
        run: |
          set -euo pipefail
          . /etc/os-release
          case "${VERSION_ID}" in
            22.04) deb=x86_64-ubuntu-2204-souffle-2.5-Linux.deb ;;
            *)     deb=x86_64-ubuntu-2404-souffle-2.5-Linux.deb ;;
          esac
          curl -fsSL -o /tmp/souffle.deb "https://github.com/souffle-lang/souffle/releases/download/2.5/${deb}"
          sudo apt-get update
          sudo apt-get install -y libncurses6
          sudo dpkg -i /tmp/souffle.deb || sudo apt-get install -y -f
          souffle --version
      - name: Soufflé eval fixtures
        run: |
          bash datalog/tests/run.sh
          bash datalog/admission_tests/run.sh
      - name: Typecheck programs already on main
        run: |
          set +e
          souffle --parse-errors --show=type-analysis datalog/minikran_gate.dl
          souffle --parse-errors --show=type-analysis datalog/minikran_admission.dl
          # The checked program already on main currently fails Soufflé (ungrounded midPrio,
          # cyclic negation). Record the errors; do not patch that file.
          if ! souffle --parse-errors --show=type-analysis datalog/minikran_admission_checked.dl; then
            echo "TYPECHECK_FAIL datalog/minikran_admission_checked.dl (recorded, not patched)"
          fi

  lean-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Generate lake-manifest.json
        run: |
          source $HOME/.elan/env
          lake update
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
      - name: Typecheck MinikranProofs (no lakefile.toml edit)
        run: |
          source $HOME/.elan/env
          lake -f lakefile-eval.toml build Minikran Minikran.Timed MinikranProofs
          lake -f lakefile-eval.toml env lean MinikranProofs/AxiomCheck.lean
